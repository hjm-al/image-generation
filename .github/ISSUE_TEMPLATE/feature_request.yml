name: Feature request
description: Propose a focused workflow, compatibility, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe inputs, outputs, defaults, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and cost
      description: Note CLI changes, provider assumptions, extra requests, and migration impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler or narrower solution did you consider?
  - type: checkboxes
    id: checks
    attributes:
      label: Scope checks
      options:
        - label: This request does not require an automatic retry or silent second billable request.
          required: true
        - label: I removed credentials and private client material from this request.
          required: true
